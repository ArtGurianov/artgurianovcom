name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - contentful-rebuild

jobs:
  lint:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  deploy_pages_en:
    runs-on: ubuntu-latest
    needs: [lint]
    if: ${{ always() && (github.event_name == 'repository_dispatch' || needs.lint.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site (EN)
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_LOCALE: en-US
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_PUBLIC_KEY }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

      - name: Deploy to Cloudflare Pages (EN)
        run: pnpm dlx wrangler pages deploy out --project-name=${{ vars.CF_PAGES_PROJECT_NAME_EN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy_pages_ru:
    runs-on: ubuntu-latest
    needs: [lint]
    if: ${{ always() && (github.event_name == 'repository_dispatch' || needs.lint.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site (RU)
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_LOCALE: ru-RU
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RECAPTCHA_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_PUBLIC_KEY }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

      - name: Deploy to Cloudflare Pages (RU)
        run: pnpm dlx wrangler pages deploy out --project-name=${{ vars.CF_PAGES_PROJECT_NAME_RU }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Worker deploy is intentionally skipped for repository_dispatch because
  # Contentful-triggered events only need to rebuild static Pages outputs.
  deploy_worker_api:
    runs-on: ubuntu-latest
    needs: [lint]
    if: ${{ github.event_name != 'repository_dispatch' && needs.lint.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies (shared layer)
        run: pnpm install --frozen-lockfile

      - name: Install worker dependencies
        # Switch to --frozen-lockfile after committing worker/pnpm-lock.yaml.
        run: pnpm install --no-frozen-lockfile --dir worker

      - name: Typecheck worker
        run: pnpm --dir worker typecheck

      - name: Deploy API Worker
        run: pnpm --dir worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
